# One-click formatter. Runs Biome with --write and commits the result to the branch you pick
# under "Use workflow from". Run it after changing code, before the Checks workflow.

name: Format

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - name: Fix formatting and import order (Biome)
        # Problems Biome can't fix by itself are left for the Checks workflow to report.
        continue-on-error: true
        run: bunx biome check --write

      - name: Commit the changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins biome.json
          if git diff --cached --quiet; then
            echo "Nothing to change."
          else
            git commit -m "Format with Biome"
            git push
          fi
